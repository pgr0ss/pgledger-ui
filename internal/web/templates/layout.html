{{define "layout"}}
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{{.Title}} · pgledger</title>
      <link rel="stylesheet" href="/static/app.css">
      <script src="/static/app.js" defer></script>
    </head>
    <body>
      <header class="top">
        <a class="brand" href="/">pgledger visualizer</a>
        <nav>
          <a href="/search" class="{{if eq .Nav "search"}}active{{end}}">Search</a>
          <a href="/accounts" class="{{if eq .Nav "accounts"}}active{{end}}">Accounts</a>
          <a href="/transfers" class="{{if eq .Nav "transfers"}}active{{end}}">Transfers</a>
          <a href="/entries" class="{{if eq .Nav "entries"}}active{{end}}">Entries</a>
          <a href="/trace" class="{{if eq .Nav "trace"}}active{{end}}">Trace</a>
        </nav>
        <button type="button" class="tz" data-tz-toggle>Times: UTC</button>
      </header>
      <main>
        {{template "content" .}}
      </main>
    </body>
  </html>
{{end}}
