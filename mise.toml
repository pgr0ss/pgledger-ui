[tools]
go = "1.27.4"
uv = "0.13.7"             # backs the pipx: installer
golangci-lint = "2.15.0"
"pipx:sqlfluff" = "4.5.0"
sqlc = "1.31.1"           # registry resolves to aqua:sqlc-dev/sqlc
"pipx:djlint" = "1.50.0"
biome = "2.6.4"
watchexec = "2.8.0"

[env]
_.file = ".env"

[tasks.postgres-up]
description = "Start Postgres in the foreground"
run = "docker compose up"

[tasks.postgres-up-background]
description = "Start Postgres in the background and wait until it's healthy"
run = "docker compose up --detach --wait"

[tasks.dbreset]
description = "Drop and recreate the pgledger-visualizer database"
run = [
  "docker compose exec postgres dropdb --force --if-exists -U pgledger pgledger-visualizer",
  "docker compose exec postgres createdb -U pgledger pgledger-visualizer",
]

[tasks.psql]
description = "Open psql on the pgledger-visualizer database; extra args go to psql"
run = "docker compose exec postgres psql -U pgledger pgledger-visualizer"

[tasks.seed]
description = "Install pgledger if missing and load sample data; extra args go to `seed`"
run = 'go run . seed --install-schema --database-url "${DATABASE_URL:-postgres://pgledger:pgledger@localhost:${POSTGRES_PORT:-5432}/pgledger-visualizer}"'

[tasks.serve]
description = "Run the visualizer; extra args go to `serve`"
run = 'go run . serve --database-url "${DATABASE_URL:-postgres://pgledger:pgledger@localhost:${POSTGRES_PORT:-5432}/pgledger-visualizer}"'

[tasks.dev]
description = "serve --dev, restarted when Go or SQL files change (templates and CSS reload live); extra args go to `serve`"
run = 'watchexec --restart --shell=none --exts go,sql -- go run . serve --dev --database-url "${DATABASE_URL:-postgres://pgledger:pgledger@localhost:${POSTGRES_PORT:-5432}/pgledger-visualizer}"'

[tasks.demo]
description = "Fresh database, sample data, then serve"
run = [
  { task = "postgres-up-background" },
  { task = "dbreset" },
  { task = "seed" },
  { task = "serve" },
]

[tasks.screenshots]
description = "Screenshot a running visualizer in light and dark mode into screenshots/ (needs Google Chrome)"
run = [
  "scripts/screenshots.sh screenshots/light",
  "DARK=1 scripts/screenshots.sh screenshots/dark",
]

[tasks.test]
run = "go test -race ./..."

[tasks.generate]
run = "sqlc generate"

[tasks.sqlc-check]
description = "Fail if queries don't compile or generated code is stale"
run = ["sqlc compile", "sqlc diff"]

[tasks.lint-sql]
run = "sqlfluff lint"

[tasks.format-sql]
run = "sqlfluff format"

[tasks.lint-html]
description = "Lint templates and fail if any need reformatting"
run = "djlint internal/web/templates --lint --check"

[tasks.format-html]
run = "djlint internal/web/templates --reformat"

[tasks.lint-static]
description = "Lint CSS and JS and fail if any need reformatting"
run = "biome check"

[tasks.format-static]
run = "biome format --write"

[tasks.golangci-lint]
run = "golangci-lint run"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.lint]
depends = [
  "lint-sql",
  "lint-html",
  "lint-static",
  "sqlc-check",
  "golangci-lint",
  "tidy-check",
]

[tasks.check]
description = "Format, regenerate, tidy, test, lint (local pre-commit)"
run = [
  { task = "format-sql" },
  { task = "format-html" },
  { task = "format-static" },
  { task = "generate" },
  "go mod tidy",
  { task = "test" },
  { task = "lint" },
]

[tasks.sync-pgledger]
description = "Copy pgledger's schema files into internal/pgschema/sql"
usage = 'arg "[dir]" default="../pgledger"'
run = [
  'cp "$usage_dir/vendor/scoville-pgsql-ulid/ulid-to-uuid.sql" "$usage_dir/vendor/scoville-pgsql-ulid/uuid-to-ulid.sql" "$usage_dir/pgledger.sql" internal/pgschema/sql/',
  'git -C "$usage_dir" rev-parse HEAD > internal/pgschema/sql/VERSION',
]
