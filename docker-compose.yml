services:
  postgres:
    image: "postgres:${POSTGRES_VERSION:-18}"
    command: >
      -c max_wal_size=2GB
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    networks:
      - postgres-network
    environment:
      POSTGRES_USER: pgledger
      POSTGRES_PASSWORD: pgledger
      POSTGRES_DB: pgledger-ui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgledger"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  postgres-network:
    driver: bridge
