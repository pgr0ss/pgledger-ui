# Starts Postgres, loads sample data and serves the UI on http://127.0.0.1:8080.
# See "Try it with Docker" in README.md.
name: pgledger-ui-demo

x-ui: &ui
  build: .
  environment:
    DATABASE_URL: postgres://pgledger:pgledger@postgres:5432/pgledger-ui

services:
  postgres:
    image: postgres:19
    environment:
      POSTGRES_USER: pgledger
      POSTGRES_PASSWORD: pgledger
      POSTGRES_DB: pgledger-ui
    # Stopping the container discards the data, so every start seeds fresh data relative to now.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # TCP, because the image's init-time server listens only on its Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgledger -d pgledger-ui"]
      interval: 2s
      timeout: 5s
      retries: 30

  seed:
    <<: *ui
    command: ["seed", "--install-schema"]
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    <<: *ui
    command: ["serve"]
    ports:
      - 127.0.0.1:${DEMO_PORT:-8080}:8080
    depends_on:
      seed:
        condition: service_completed_successfully
